<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220">
  <!-- Garden bouquet anchored bottom-left: eucalyptus, olive sprigs, white garden roses, ranunculus and berries -->
  <defs>
    <radialGradient id="wr" cx=".45" cy=".4" r=".75">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".6" stop-color="#F6F1E8"/><stop offset="1" stop-color="#DCD2C2"/>
    </radialGradient>
    <radialGradient id="cr" cx=".45" cy=".4" r=".75">
      <stop offset="0" stop-color="#FFF8EC"/><stop offset=".6" stop-color="#F1E3C8"/><stop offset="1" stop-color="#D6C09A"/>
    </radialGradient>
    <linearGradient id="eu" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B7C6B6"/><stop offset="1" stop-color="#7E968A"/></linearGradient>
    <linearGradient id="ol" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A3B08A"/><stop offset="1" stop-color="#5E6E4D"/></linearGradient>
    <g id="rose">
      <g fill="url(#wr)" stroke="#CFC3B0" stroke-width=".6">
        <ellipse cx="0" cy="-15" rx="13" ry="17"/><ellipse cx="0" cy="-15" rx="13" ry="17" transform="rotate(60)"/>
        <ellipse cx="0" cy="-15" rx="13" ry="17" transform="rotate(120)"/><ellipse cx="0" cy="-15" rx="13" ry="17" transform="rotate(180)"/>
        <ellipse cx="0" cy="-15" rx="13" ry="17" transform="rotate(240)"/><ellipse cx="0" cy="-15" rx="13" ry="17" transform="rotate(300)"/>
      </g>
      <g fill="url(#wr)" stroke="#CFC3B0" stroke-width=".5">
        <ellipse cx="0" cy="-8" rx="9" ry="11" transform="rotate(30)"/><ellipse cx="0" cy="-8" rx="9" ry="11" transform="rotate(150)"/><ellipse cx="0" cy="-8" rx="9" ry="11" transform="rotate(270)"/>
      </g>
      <path d="M-5 0 C-5 -6 5 -7 5 0 C5 4 -1 5 -2 1" stroke="#C9BBA4" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    </g>
    <g id="ranun">
      <circle r="14" fill="url(#cr)" stroke="#CDB58C" stroke-width=".6"/>
      <circle r="10" fill="none" stroke="#D8C39E" stroke-width="1"/><circle r="6" fill="none" stroke="#D8C39E" stroke-width="1"/>
      <circle r="2.5" fill="#9DAE84"/>
    </g>
    <!-- eucalyptus stem: round coin leaves -->
    <g id="euca">
      <path d="M0 0 C10 -30 22 -60 40 -90" stroke="#7E968A" stroke-width="1.6" fill="none"/>
      <g fill="url(#eu)" stroke="#6F877B" stroke-width=".4">
        <circle cx="-4" cy="-14" r="8"/><circle cx="14" cy="-24" r="8.5"/><circle cx="6" cy="-42" r="8"/>
        <circle cx="26" cy="-52" r="7.5"/><circle cx="20" cy="-70" r="7"/><circle cx="38" cy="-80" r="6.5"/>
      </g>
    </g>
    <g id="olive">
      <path d="M0 0 C16 -20 36 -36 64 -44" stroke="#5E6E4D" stroke-width="1.3" fill="none"/>
      <g fill="url(#ol)">
        <ellipse cx="12" cy="-16" rx="3" ry="11" transform="rotate(-50 12 -16)"/><ellipse cx="18" cy="-8" rx="3" ry="11" transform="rotate(40 18 -8)"/>
        <ellipse cx="30" cy="-30" rx="3" ry="11" transform="rotate(-60 30 -30)"/><ellipse cx="38" cy="-22" rx="3" ry="11" transform="rotate(30 38 -22)"/>
        <ellipse cx="50" cy="-40" rx="3" ry="10" transform="rotate(-70 50 -40)"/><ellipse cx="56" cy="-34" rx="3" ry="10" transform="rotate(20 56 -34)"/>
      </g>
    </g>
  </defs>
  <use href="#euca" transform="translate(60 210) rotate(-10)"/>
  <use href="#euca" transform="translate(120 205) rotate(30) scale(.9)"/>
  <use href="#olive" transform="translate(150 200) rotate(-10)"/>
  <use href="#olive" transform="translate(20 190) rotate(-70) scale(.9)"/>
  <use href="#euca" transform="translate(190 215) rotate(60) scale(.8)"/>
  <use href="#ranun" transform="translate(150 160)"/>
  <use href="#rose" transform="translate(100 168) scale(1.15)"/>
  <use href="#rose" transform="translate(44 192) scale(1.35)"/>
  <use href="#ranun" transform="translate(196 196) scale(1.1)"/>
  <use href="#rose" transform="translate(140 206) scale(.95)"/>
  <g fill="#7D8C6A"><circle cx="176" cy="150" r="3.2"/><circle cx="184" cy="160" r="2.8"/><circle cx="170" cy="164" r="2.6"/><circle cx="18" cy="150" r="3"/><circle cx="26" cy="140" r="2.5"/></g>
</svg>
