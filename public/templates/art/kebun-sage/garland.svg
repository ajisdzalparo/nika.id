    <linearGradient id="ol" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A9B693"/><stop offset="1" stop-color="#617252"/></linearGradient>
    <radialGradient id="wr" cx=".45" cy=".4" r=".75"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".7" stop-color="#F3EDE2"/><stop offset="1" stop-color="#D8CDBB"/></radialGradient>
    <g id="rose">
