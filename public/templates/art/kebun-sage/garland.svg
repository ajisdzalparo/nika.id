    <circle cx="160" cy="76" r="8"/><circle cx="200" cy="78" r="8.5"/><circle cx="240" cy="76" r="8"/><circle cx="278" cy="70" r="8.5"/>
    <circle cx="310" cy="62" r="8"/><circle cx="340" cy="52" r="8.5"/><circle cx="366" cy="38" r="8"/>
