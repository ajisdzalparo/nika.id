        <ellipse cx="0" cy="-11" rx="10" ry="13"/><ellipse cx="0" cy="-11" rx="10" ry="13" transform="rotate(72)"/>
        <ellipse cx="0" cy="-11" rx="10" ry="13" transform="rotate(144)"/><ellipse cx="0" cy="-11" rx="10" ry="13" transform="rotate(216)"/>
