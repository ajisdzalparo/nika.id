  <path d="M0 16 C100 92 300 92 400 16" stroke="#8FA08B" stroke-width="1.6" fill="none"/>
  <g fill="url(#dm)">
    <use href="#lf" transform="translate(40 44) rotate(20)"/><use href="#lf" transform="translate(76 62) rotate(200)"/>
    <use href="#lf" transform="translate(110 72) rotate(15)"/><use href="#lf" transform="translate(150 80) rotate(195)"/>
    <use href="#lf" transform="translate(250 80) rotate(-15)"/><use href="#lf" transform="translate(290 72) rotate(165)"/>
    <use href="#lf" transform="translate(324 62) rotate(-20)"/><use href="#lf" transform="translate(360 44) rotate(160)"/>
  </g>
  <g fill="url(#dr)"><use href="#rose" transform="translate(24 22) scale(1.3)"/><use href="#rose" transform="translate(376 22) scale(1.3)"/></g>
  <g fill="url(#bg)"><use href="#rose" transform="translate(50 14) scale(.9)"/><use href="#rose" transform="translate(350 14) scale(.9)"/><use href="#rose" transform="translate(200 84) scale(.9)"/></g>
  <g fill="url(#bl)"><use href="#rose" transform="translate(182 82) scale(.7)"/><use href="#rose" transform="translate(218 82) scale(.7)"/></g>
