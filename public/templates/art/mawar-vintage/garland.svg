<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120">
  <!-- Top rose swag: a dipping garland of dusty-miller leaves with roses clustered at the corners and centre -->
  <defs>
    <radialGradient id="dr" cx=".45" cy=".4" r=".75"><stop offset="0" stop-color="#F6DCD6"/><stop offset=".6" stop-color="#D9A3A0"/><stop offset="1" stop-color="#B07477"/></radialGradient>
    <radialGradient id="bg" cx=".45" cy=".4" r=".75"><stop offset="0" stop-color="#B4505F"/><stop offset=".6" stop-color="#83293C"/><stop offset="1" stop-color="#5A1828"/></radialGradient>
    <radialGradient id="bl" cx=".45" cy=".4" r=".75"><stop offset="0" stop-color="#FFF3EE"/><stop offset="1" stop-color="#D9B2A6"/></radialGradient>
    <linearGradient id="dm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D3D7CF"/><stop offset="1" stop-color="#93A096"/></linearGradient>
    <g id="rose" stroke="#00000022" stroke-width=".5">
      <ellipse cx="0" cy="-10" rx="9" ry="12"/><ellipse cx="0" cy="-10" rx="9" ry="12" transform="rotate(72)"/>
      <ellipse cx="0" cy="-10" rx="9" ry="12" transform="rotate(144)"/><ellipse cx="0" cy="-10" rx="9" ry="12" transform="rotate(216)"/>
      <ellipse cx="0" cy="-10" rx="9" ry="12" transform="rotate(288)"/>
    </g>
