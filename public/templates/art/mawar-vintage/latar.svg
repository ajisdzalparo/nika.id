<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice">
  <!-- Old paper: warm blush wash, soft vignette and faint speckles -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F8EEE8"/><stop offset="1" stop-color="#EFDFD5"/></linearGradient>
    <radialGradient id="vig" cx=".5" cy=".45" r=".75"><stop offset=".55" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="1" stop-color="#B98A7E" stop-opacity=".22"/></radialGradient>
  </defs>
  <rect width="400" height="800" fill="url(#bg)"/>
  <g fill="#B98A7E" opacity=".12">
    <circle cx="40" cy="80" r="1.4"/><circle cx="320" cy="140" r="1.1"/><circle cx="120" cy="300" r="1.2"/><circle cx="260" cy="420" r="1.5"/>
    <circle cx="60" cy="560" r="1.1"/><circle cx="350" cy="620" r="1.3"/><circle cx="200" cy="720" r="1.2"/><circle cx="90" cy="460" r="1"/>
  </g>
  <rect width="400" height="800" fill="url(#vig)"/>
</svg>
