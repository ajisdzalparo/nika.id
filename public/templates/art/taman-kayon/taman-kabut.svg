<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice">
  <!-- Misty garden: pale sky, two rows of soft tree silhouettes on both sides, a light path of fog -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EEF0E8"/>
      <stop offset=".55" stop-color="#F4F2EA"/>
      <stop offset="1" stop-color="#EAE6DA"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".38" r=".55">
      <stop offset="0" stop-color="#FFFDF6" stop-opacity=".95"/>
      <stop offset="1" stop-color="#FFFDF6" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="softer" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>
  <rect width="400" height="800" fill="url(#sky)"/>
  <!-- far trees -->
  <g fill="#C3CDB9" opacity=".4" filter="url(#soft)">
    <path d="M-20 520 Q10 380 40 420 Q50 330 75 400 Q95 360 100 470 L100 800 L-20 800Z"/>
    <path d="M420 520 Q390 380 360 420 Q350 330 325 400 Q305 360 300 470 L300 800 L420 800Z"/>
  </g>
  <!-- near trees -->
  <g fill="#A3B399" opacity=".35" filter="url(#soft)">
    <path d="M-30 640 Q-10 470 30 500 Q45 420 80 470 Q80 440 84 540 Q90 520 88 800 L-30 800Z"/>
    <path d="M430 640 Q410 470 370 500 Q355 420 320 470 Q320 440 316 540 Q310 520 312 800 L430 800Z"/>
  </g>

  <!-- light at the centre and a band of fog near the ground -->
  <rect width="400" height="800" fill="url(#glow)"/>
  <ellipse cx="200" cy="700" rx="260" ry="70" fill="#FBFAF4" opacity=".75" filter="url(#soft)"/>
</svg>
