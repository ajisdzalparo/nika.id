<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220">
  <!-- Bouquet anchored to the bottom-left: two peonies, a rose, white blossoms, buds and sage leaves.
       Flip horizontally for the right-hand corner. -->
  <defs>
    <radialGradient id="pk" cx=".45" cy=".4" r=".7">
      <stop offset="0" stop-color="#FBE3E6"/><stop offset=".55" stop-color="#EFB3BD"/><stop offset="1" stop-color="#C9727F"/>
    </radialGradient>
    <radialGradient id="pkIn" cx=".5" cy=".5" r=".6">
      <stop offset="0" stop-color="#C25D6E"/><stop offset="1" stop-color="#E9A2AE"/>
    </radialGradient>
    <radialGradient id="mr" cx=".45" cy=".4" r=".7">
      <stop offset="0" stop-color="#C2475A"/><stop offset=".6" stop-color="#9A2C3E"/><stop offset="1" stop-color="#6E1C2A"/>
    </radialGradient>
    <radialGradient id="wh" cx=".5" cy=".45" r=".7">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset=".7" stop-color="#F7EFE6"/><stop offset="1" stop-color="#E4D4C4"/>
    </radialGradient>
    <linearGradient id="lf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9DB091"/><stop offset="1" stop-color="#5F7656"/>
    </linearGradient>
    <linearGradient id="lf2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B9C7AE"/><stop offset="1" stop-color="#7E9473"/>
    </linearGradient>
    <!-- one peony: rings of overlapping cupped petals around a deep centre -->
    <g id="peony">
      <g fill="url(#pk)" stroke="#B8606E" stroke-width=".6" stroke-opacity=".45">
        <ellipse cx="0" cy="-24" rx="17" ry="24" transform="rotate(0)"/>
        <ellipse cx="0" cy="-24" rx="17" ry="24" transform="rotate(36)"/>
        <ellipse cx="0" cy="-24" rx="17" ry="24" transform="rotate(72)"/>
        <ellipse cx="0" cy="-24" rx="17" ry="24" transform="rotate(108)"/>
        <ellipse cx="0" cy="-24" rx="17" ry="24" transform="rotate(144)"/>
        <ellipse cx="0" cy="-24" rx="17" ry="24" transform="rotate(180)"/>
        <ellipse cx="0" cy="-24" rx="17" ry="24" transform="rotate(216)"/>
        <ellipse cx="0" cy="-24" rx="17" ry="24" transform="rotate(252)"/>
        <ellipse cx="0" cy="-24" rx="17" ry="24" transform="rotate(288)"/>
        <ellipse cx="0" cy="-24" rx="17" ry="24" transform="rotate(324)"/>
      </g>
      <g fill="url(#pk)" stroke="#B8606E" stroke-width=".5" stroke-opacity=".45">
        <ellipse cx="0" cy="-14" rx="12" ry="16" transform="rotate(22)"/>
        <ellipse cx="0" cy="-14" rx="12" ry="16" transform="rotate(67)"/>
        <ellipse cx="0" cy="-14" rx="12" ry="16" transform="rotate(112)"/>
        <ellipse cx="0" cy="-14" rx="12" ry="16" transform="rotate(157)"/>
        <ellipse cx="0" cy="-14" rx="12" ry="16" transform="rotate(202)"/>
        <ellipse cx="0" cy="-14" rx="12" ry="16" transform="rotate(247)"/>
        <ellipse cx="0" cy="-14" rx="12" ry="16" transform="rotate(292)"/>
        <ellipse cx="0" cy="-14" rx="12" ry="16" transform="rotate(337)"/>
      </g>
      <circle r="12" fill="url(#pkIn)"/>
      <g fill="#F4C3CB" opacity=".85">
        <ellipse cx="-4" cy="-3" rx="5" ry="7" transform="rotate(-25)"/><ellipse cx="4" cy="-3" rx="5" ry="7" transform="rotate(25)"/>
      </g>
    </g>
    <g id="rose">
      <g fill="url(#mr)" stroke="#5E1622" stroke-width=".5" stroke-opacity=".5">
        <ellipse cx="0" cy="-13" rx="12" ry="16" transform="rotate(0)"/>
        <ellipse cx="0" cy="-13" rx="12" ry="16" transform="rotate(51)"/>
        <ellipse cx="0" cy="-13" rx="12" ry="16" transform="rotate(102)"/>
        <ellipse cx="0" cy="-13" rx="12" ry="16" transform="rotate(153)"/>
        <ellipse cx="0" cy="-13" rx="12" ry="16" transform="rotate(204)"/>
        <ellipse cx="0" cy="-13" rx="12" ry="16" transform="rotate(255)"/>
        <ellipse cx="0" cy="-13" rx="12" ry="16" transform="rotate(306)"/>
      </g>
      <circle r="11" fill="#7E2232"/>
      <path d="M-6 -1 C-6 -8 6 -9 7 -1 C7 5 -1 7 -3 2 C-4 -2 2 -4 3 0" stroke="#D86A7C" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    </g>
    <g id="blossom">
      <g fill="url(#wh)" stroke="#D9C6B2" stroke-width=".6">
        <ellipse cx="0" cy="-11" rx="8" ry="11"/><ellipse cx="0" cy="-11" rx="8" ry="11" transform="rotate(72)"/>
        <ellipse cx="0" cy="-11" rx="8" ry="11" transform="rotate(144)"/><ellipse cx="0" cy="-11" rx="8" ry="11" transform="rotate(216)"/>
        <ellipse cx="0" cy="-11" rx="8" ry="11" transform="rotate(288)"/>
      </g>
      <circle r="4" fill="#E2B65C"/>
    </g>
    <path id="leaf" d="M0 0 C10 -18 34 -24 52 -20 C40 -4 18 6 0 0Z"/>
  </defs>

  <!-- leaves behind -->
  <g>
    <use href="#leaf" fill="url(#lf)" transform="translate(70 150) rotate(-40) scale(1.6)"/>
    <use href="#leaf" fill="url(#lf2)" transform="translate(120 150) rotate(-75) scale(1.4)"/>
    <use href="#leaf" fill="url(#lf)" transform="translate(150 175) rotate(-10) scale(1.5)"/>
    <use href="#leaf" fill="url(#lf2)" transform="translate(30 170) rotate(-95) scale(1.3)"/>
    <use href="#leaf" fill="url(#lf)" transform="translate(190 195) rotate(-20) scale(1.2)"/>
    <path d="M40 220 C60 160 90 120 140 92" stroke="#7E9473" stroke-width="2.4" fill="none"/>
    <path d="M140 92 c6 -10 16 -12 18 -6 -4 8 -12 10 -18 6Z" fill="#C9727F"/>
    <path d="M118 104 c4 -10 14 -12 16 -6 -4 8 -10 10 -16 6Z" fill="#EFB3BD"/>
  </g>
  <!-- flowers, back to front -->
  <use href="#blossom" transform="translate(150 140) scale(1.1)"/>
  <use href="#peony" transform="translate(112 160) scale(1.05)"/>
  <use href="#rose" transform="translate(48 150) scale(1.05)"/>
  <use href="#blossom" transform="translate(196 186) scale(1.25)"/>
  <use href="#peony" transform="translate(40 200) scale(1.25)"/>
  <use href="#blossom" transform="translate(92 206) scale(1.2)"/>
  <use href="#rose" transform="translate(150 206) scale(.8)"/>
  <!-- small dots of gypsophila -->
  <g fill="#FFFFFF" stroke="#E4D4C4" stroke-width=".4">
    <circle cx="176" cy="150" r="3"/><circle cx="184" cy="142" r="2.4"/><circle cx="170" cy="132" r="2.6"/>
    <circle cx="20" cy="140" r="2.6"/><circle cx="12" cy="128" r="2.2"/><circle cx="228" cy="200" r="2.6"/>
  </g>
</svg>
