<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 300">
  <!-- Hanging vine for the side edges: a curving stem with sage leaves and small white blossoms -->
  <defs>
    <linearGradient id="lf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A9BA9C"/><stop offset="1" stop-color="#647B5B"/>
    </linearGradient>
    <path id="leaf" d="M0 0 C8 -14 26 -18 40 -15 C30 -3 14 4 0 0Z"/>
    <g id="flower" fill="#FFFFFF" stroke="#DCCBB8" stroke-width=".5">
      <circle cx="0" cy="-5" r="4.5"/><circle cx="4.8" cy="-1.5" r="4.5"/><circle cx="3" cy="4" r="4.5"/>
      <circle cx="-3" cy="4" r="4.5"/><circle cx="-4.8" cy="-1.5" r="4.5"/><circle r="2.2" fill="#E2B65C" stroke="none"/>
    </g>
  </defs>
  <path d="M10 0 C40 40 20 90 46 130 C70 170 40 220 60 300" stroke="#6F8569" stroke-width="2" fill="none"/>
  <g fill="url(#lf)">
    <use href="#leaf" transform="translate(24 30) rotate(20)"/>
    <use href="#leaf" transform="translate(30 60) rotate(160)"/>
    <use href="#leaf" transform="translate(30 100) rotate(25)"/>
    <use href="#leaf" transform="translate(48 132) rotate(170)"/>
    <use href="#leaf" transform="translate(52 170) rotate(30)"/>
    <use href="#leaf" transform="translate(46 210) rotate(165)"/>
    <use href="#leaf" transform="translate(56 250) rotate(35)"/>
  </g>
  <use href="#flower" transform="translate(38 74) scale(1.1)"/>
  <use href="#flower" transform="translate(60 150)"/>
  <use href="#flower" transform="translate(44 230) scale(1.2)"/>
</svg>
