name: CI/CD Build and Deploy

on:
  push:
    branches:
      - dev
      - prod
  pull_request:
    branches:
      - dev
      - prod

env:
  REGISTRY: ghcr.io
  # Pinned instead of github.repository so a future repo rename doesn't silently change the image
  IMAGE_NAME: ${{ github.repository_owner }}/satumoment

jobs:
  verify:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript Check
        run: bunx tsc --noEmit

      - name: ESLint Check
        run: bunx eslint app components lib

  build-and-push:
    name: Build & Push Docker Image
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase IMAGE_NAME
        run: |
          echo "IMAGE_NAME_LC=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_APP_URL=https://undanginyuk.ajisdzalparo.com
            NEXT_PUBLIC_GOOGLE_OAUTH_ENABLED=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    steps:
      - name: Check configured deploy targets
        id: targets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          DOKPLOY_WEBHOOK: ${{ secrets.DOKPLOY_WEBHOOK }}
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
        run: |
          echo "has_vps=$([ -n "$VPS_HOST" ] && [ -n "$VPS_SSH_KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_dokploy=$([ -n "$DOKPLOY_WEBHOOK" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_coolify=$([ -n "$COOLIFY_WEBHOOK" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH to VPS
        if: steps.targets.outputs.has_vps == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'atmarbyte' }}
          port: ${{ secrets.VPS_PORT || 22 }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ~/projects/undangin-yuk
            COMPOSE_FILE="docker-compose.prod.yml"
            [ -f "$COMPOSE_FILE" ] || COMPOSE_FILE="docker-compose.yml"
            # The repo was renamed nika.id -> satumoment; point the VPS compose at the new image (no-op once done)
            sed -i 's#ghcr.io/ajisdzalparo/nika.id:#ghcr.io/ajisdzalparo/satumoment:#' "$COMPOSE_FILE"
            docker compose -f "$COMPOSE_FILE" pull app
            docker compose -f "$COMPOSE_FILE" up -d
            docker exec nikaid-app sh -c 'npx --yes prisma@6 db push --skip-generate || bunx prisma@6 db push --skip-generate' || true
            docker image prune -f

      - name: Trigger Dokploy Redeploy
        if: steps.targets.outputs.has_dokploy == 'true'
        run: curl -fsSL -X POST "${{ secrets.DOKPLOY_WEBHOOK }}"

      - name: Trigger Coolify Deploy
        if: steps.targets.outputs.has_coolify == 'true'
        run: |
          curl -fsSL --request GET \
            --url "${{ secrets.COOLIFY_WEBHOOK }}" \
            --header "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
