name: CI/CD Build and Deploy

# dev = local only (no CI). staging -> staging image, prod -> production image + VPS deploy
on:
  push:
    branches:
      - staging
      - prod
  pull_request:
    branches:
      - staging
      - prod

env:
  REGISTRY: ghcr.io
  # Pinned instead of github.repository so a future repo rename doesn't silently change the image
  IMAGE_NAME: ${{ github.repository_owner }}/satumoment

jobs:
  verify:
    name: Typecheck & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history so the migration check below can diff against the previous commit / base branch
          fetch-depth: 0

      # Stops the pipeline when a new migration can delete data (DROP TABLE/COLUMN, column type changes,
      # TRUNCATE, DELETE). If the change is intended and its data is handled (copied, backed up), add the line
      # `-- destructive-ok: <reason>` to that migration.sql to let it through.
      - name: Check new migrations for data loss
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then
            RANGE="origin/$BASE_REF...HEAD"
          elif [ -n "$BEFORE_SHA" ] && ! echo "$BEFORE_SHA" | grep -qE '^0+$'; then
            RANGE="$BEFORE_SHA..HEAD"
          else
            echo "No previous commit to compare; skipping migration check"; exit 0
          fi
          NEW=$(git diff --name-only --diff-filter=AM "$RANGE" -- 'prisma/migrations/*/migration.sql' || true)
          [ -n "$NEW" ] || { echo "No new migrations"; exit 0; }
          FAIL=0
          for f in $NEW; do
            if grep -qi 'destructive-ok' "$f"; then
              echo "::warning file=$f::Destructive statements acknowledged with destructive-ok"
              continue
            fi
            HITS=$(grep -nEi 'DROP[[:space:]]+(TABLE|COLUMN|SCHEMA)|ALTER[[:space:]]+COLUMN[[:space:]]+[^[:space:]]+[[:space:]]+(SET[[:space:]]+DATA[[:space:]]+)?TYPE|TRUNCATE|DELETE[[:space:]]+FROM' "$f" || true)
            if [ -n "$HITS" ]; then
              echo "::error file=$f::Migration may delete production data:"
              echo "$HITS"
              FAIL=1
            fi
          done
          [ "$FAIL" -eq 0 ] || { echo "Review these migrations. If intended, add '-- destructive-ok: <reason>' to the file."; exit 1; }
          echo "New migrations are additive: $NEW"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript Check
        run: bunx tsc --noEmit

      - name: ESLint Check
        run: bunx eslint app components lib

  build-and-push:
    # staging -> staging image, prod -> production image (NEXT_PUBLIC_* is baked in at build time, so each needs its own build)
    name: Build & Push Docker Image (${{ github.ref == 'refs/heads/prod' && 'production' || 'staging' }})
    needs: verify
    if: github.event_name == 'push' && (github.ref == 'refs/heads/prod' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Separate GHCR packages: prod -> <owner>/satumoment, staging -> <owner>/satumoment-staging
      - name: Pick environment and image name
        run: |
          BASE="$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')"
          if [ "${{ github.ref }}" = "refs/heads/prod" ]; then
            echo "DEPLOY_ENV=production" >> $GITHUB_ENV
            echo "IMAGE_NAME_LC=$BASE" >> $GITHUB_ENV
            echo "APP_URL=https://satumoment.com" >> $GITHUB_ENV
          else
            echo "DEPLOY_ENV=staging" >> $GITHUB_ENV
            echo "IMAGE_NAME_LC=$BASE-staging" >> $GITHUB_ENV
            echo "APP_URL=https://satumoment-staging.ajisdzalparo.com" >> $GITHUB_ENV
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}
          # Each package gets: latest + sha-<short sha>
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ env.APP_URL }}
            NEXT_PUBLIC_GOOGLE_OAUTH_ENABLED=true
          cache-from: type=gha,scope=${{ env.DEPLOY_ENV }}
          cache-to: type=gha,mode=max,scope=${{ env.DEPLOY_ENV }}

  deploy:
    name: Deploy to VPS
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    steps:
      - name: Check configured deploy targets
        id: targets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          DOKPLOY_WEBHOOK: ${{ secrets.DOKPLOY_WEBHOOK }}
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
        run: |
          echo "has_vps=$([ -n "$VPS_HOST" ] && [ -n "$VPS_SSH_KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_dokploy=$([ -n "$DOKPLOY_WEBHOOK" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_coolify=$([ -n "$COOLIFY_WEBHOOK" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH to VPS
        if: steps.targets.outputs.has_vps == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'atmarbyte' }}
          port: ${{ secrets.VPS_PORT || 22 }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            # VPS folder moved undangin-yuk -> satumoment; fall back while migrating
            cd ~/projects/satumoment 2>/dev/null || cd ~/projects/undangin-yuk
            COMPOSE_FILE="docker-compose.prod.yml"
            [ -f "$COMPOSE_FILE" ] || COMPOSE_FILE="docker-compose.yml"
            # The repo was renamed nika.id -> satumoment; point the VPS compose at the new image (no-op once done)
            sed -i 's#ghcr.io/ajisdzalparo/nika.id:#ghcr.io/ajisdzalparo/satumoment:#' "$COMPOSE_FILE"

            # Back up the database before anything changes. The new container applies migrations on start
            # (Dockerfile CMD -> scripts/db-migrate.mjs), so this dump is the restore point if one goes wrong.
            # A failed or empty dump stops the deploy (set -e). Keeps the newest 14, readable by this user only.
            # Restore: docker compose -f "$COMPOSE_FILE" exec -T postgres sh -c 'pg_restore -U "$POSTGRES_USER" -d "$POSTGRES_DB" --clean --if-exists' < FILE.dump
            umask 077
            BACKUP_DIR="$HOME/backups/satumoment"
            mkdir -p "$BACKUP_DIR"
            BACKUP_FILE="$BACKUP_DIR/pre-deploy-$(date +%Y%m%d-%H%M%S).dump"
            docker compose -f "$COMPOSE_FILE" exec -T postgres sh -c 'pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc' > "$BACKUP_FILE"
            [ -s "$BACKUP_FILE" ] || { echo "Database backup is empty; deploy aborted"; exit 1; }
            echo "Database backed up to $BACKUP_FILE ($(du -h "$BACKUP_FILE" | cut -f1))"
            ls -1t "$BACKUP_DIR"/pre-deploy-*.dump | tail -n +15 | xargs -r rm --

            docker compose -f "$COMPOSE_FILE" pull app
            docker compose -f "$COMPOSE_FILE" up -d
            # No `prisma db push` here: schema changes go only through the recorded migrations applied at
            # container start. db push would change the database outside that history and hide its errors.
            docker image prune -f

      - name: Trigger Dokploy Redeploy
        if: steps.targets.outputs.has_dokploy == 'true'
        run: curl -fsSL -X POST "${{ secrets.DOKPLOY_WEBHOOK }}"

      - name: Trigger Coolify Deploy
        if: steps.targets.outputs.has_coolify == 'true'
        run: |
          curl -fsSL --request GET \
            --url "${{ secrets.COOLIFY_WEBHOOK }}" \
            --header "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
