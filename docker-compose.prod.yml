services:
  app:
    # `satumoment` = prod branch, `satumoment-staging` = staging branch. Staging: set APP_IMAGE=ghcr.io/ajisdzalparo/satumoment-staging:latest in .env.staging
    image: ${APP_IMAGE:-ghcr.io/ajisdzalparo/satumoment:latest}
    container_name: satumoment-app
    restart: unless-stopped
    # Pick the environment with `--env-file`: docker compose --env-file .env.staging -f docker-compose.prod.yml up -d
    # (that file sets APP_ENV_FILE to itself). Without the flag this stays `.env`, as the CI deploy expects.
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      NODE_OPTIONS: "--dns-result-order=ipv4first"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      internal:
      caddy_net:
        # Old name kept as an alias so a Caddyfile still pointing at nikaid-app keeps working
        aliases:
          - nikaid-app

  postgres:
    image: postgres:16-alpine
    container_name: satumoment-postgres
    restart: unless-stopped
    ports:
      # Exposed publicly on host port 5434 (avoids port 5433 used by velomock-postgres)
      # Always set a strong POSTGRES_PASSWORD in .env!
      - "${POSTGRES_PUBLIC_PORT:-5434}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nikaid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-nikaid}
    volumes:
      - nikaid_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nikaid} -d ${POSTGRES_DB:-nikaid}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  minio:
    image: pgsty/silo:latest
    container_name: satumoment-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      # Public S3 API (9000) & MinIO Web Console (9001), also proxied over HTTPS via Caddy
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
    volumes:
      - nikaid_minio_data:/data
    networks:
      internal:
      caddy_net:
        aliases:
          - nikaid-minio

networks:
  internal:
  caddy_net:
    external: true

# Pinned to the real volume names on the VPS (compose prefixed them with the folder name `undangin-yuk`),
# so renaming containers or moving the folder never points the app at a new, empty volume.
# Never change these without migrating the data; override per server with POSTGRES_VOLUME / MINIO_VOLUME.
volumes:
  nikaid_postgres_data:
    name: ${POSTGRES_VOLUME:-undangin-yuk_nikaid_postgres_data}
  nikaid_minio_data:
    name: ${MINIO_VOLUME:-undangin-yuk_nikaid_minio_data}
