services:
  app:
    # Tag `latest`/`production` = prod branch, `staging` = staging branch. Staging: set APP_IMAGE_TAG=staging in .env.staging
    image: ghcr.io/ajisdzalparo/satumoment:${APP_IMAGE_TAG:-latest}
    container_name: nikaid-app
    restart: unless-stopped
    # Pick the environment with `--env-file`: docker compose --env-file .env.staging -f docker-compose.prod.yml up -d
    # (that file sets APP_ENV_FILE to itself). Without the flag this stays `.env`, as the CI deploy expects.
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      NODE_OPTIONS: "--dns-result-order=ipv4first"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - internal
      - caddy_net

  postgres:
    image: postgres:16-alpine
    container_name: nikaid-postgres
    restart: unless-stopped
    ports:
      # Exposed publicly on host port 5434 (avoids port 5433 used by velomock-postgres)
      # Always set a strong POSTGRES_PASSWORD in .env!
      - "${POSTGRES_PUBLIC_PORT:-5434}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nikaid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-nikaid}
    volumes:
      - nikaid_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nikaid} -d ${POSTGRES_DB:-nikaid}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  minio:
    image: pgsty/silo:latest
    container_name: nikaid-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      # Public S3 API (9000) & MinIO Web Console (9001), also proxied over HTTPS via Caddy
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
    volumes:
      - nikaid_minio_data:/data
    networks:
      - internal
      - caddy_net

networks:
  internal:
  caddy_net:
    external: true

volumes:
  nikaid_postgres_data:
  nikaid_minio_data:
