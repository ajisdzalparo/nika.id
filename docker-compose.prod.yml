# Fixed project name: networks/volumes no longer depend on the VPS folder name
name: satumoment

services:
  app:
    # `satumoment` = prod branch, `satumoment-staging` = staging branch. Staging: set APP_IMAGE=ghcr.io/ajisdzalparo/satumoment-staging:latest in .env.staging
    image: ${APP_IMAGE:-ghcr.io/ajisdzalparo/satumoment:latest}
    container_name: satumoment-app
    restart: unless-stopped
    # Pick the environment with `--env-file`: docker compose --env-file .env.staging -f docker-compose.prod.yml up -d
    # (that file sets APP_ENV_FILE to itself). Without the flag this stays `.env`, as the CI deploy expects.
    env_file:
      - ${APP_ENV_FILE:-.env}
    environment:
      NODE_OPTIONS: "--dns-result-order=ipv4first"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - internal
      - caddy_net

  postgres:
    image: postgres:16-alpine
    container_name: satumoment-postgres
    restart: unless-stopped
    ports:
      # Host-only (127.0.0.1): the app reaches Postgres over the internal network. For a DB GUI use an SSH tunnel:
      #   ssh -L 5434:127.0.0.1:5434 <vps>
      - "127.0.0.1:${POSTGRES_PUBLIC_PORT:-5434}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nikaid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-nikaid}
    volumes:
      - satumoment_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nikaid} -d ${POSTGRES_DB:-nikaid}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  minio:
    image: pgsty/silo:latest
    container_name: satumoment-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      # Host-only: public files are served over HTTPS by Caddy (/storage); the console is reachable via SSH tunnel
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
    volumes:
      - satumoment_minio_data:/data
    networks:
      - internal
      - caddy_net

networks:
  internal:
  caddy_net:
    external: true

# Explicit names so they never pick up a folder prefix. Never change them without migrating the data.
volumes:
  satumoment_postgres_data:
    name: ${POSTGRES_VOLUME:-satumoment_postgres_data}
  satumoment_minio_data:
    name: ${MINIO_VOLUME:-satumoment_minio_data}
