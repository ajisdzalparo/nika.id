# Fixed project name so volume and container names don't depend on the folder name
name: satumoment

services:
  # Production image run locally: `docker compose up -d --build app` (stop `bun run dev` first, both use port 3000).
  # The VPS uses docker-compose.prod.yml, which pulls the image CI pushes to GHCR.
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_APP_URL: http://localhost:3000
        NEXT_PUBLIC_GOOGLE_OAUTH_ENABLED: ${NEXT_PUBLIC_GOOGLE_OAUTH_ENABLED:-false}
    image: ghcr.io/ajisdzalparo/satumoment:latest
    container_name: satumoment-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Inside the compose network the services are reached by name, not localhost
      DATABASE_URL: postgresql://nikaid:nikaid_password@postgres:5432/nikaid
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - "3000:3000"
  postgres:
    image: postgres:16-alpine
    container_name: satumoment-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: nikaid
      POSTGRES_PASSWORD: nikaid_password
      POSTGRES_DB: nikaid
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nikaid"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Local S3-compatible storage for uploads (photos, music). Console: http://localhost:9001
  minio:
    image: pgsty/silo:latest
    pull_policy: missing
    container_name: satumoment-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-nikaid-local}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-nikaid-local-secret}
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
